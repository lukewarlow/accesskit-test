[workspace]
members = ["accesskit_multi_tree"]
exclude = ["egui", "accesskit"]

[package]
name = "accesskit-test"
version = "0.1.0"
edition = "2024"

[dependencies]
accesskit = { version = "0.21.1" }
accesskit_multi_tree = { version = "0.1.0", path = "accesskit_multi_tree" }
egui = "0.33.0"
egui-winit = { version = "0.33.0", features = ["accesskit"] }
egui_glow = { version = "0.33.0", features = ["winit", "x11"] }
glow = "0.16.0"
glutin = "0.32.3"
glutin-winit = "0.5.0"
log = "0.4.28"
winit = "0.30.12"

[patch.crates-io]
accesskit = { path = "./accesskit/common" }
accesskit_winit = { path = "./accesskit/platforms/winit" }
