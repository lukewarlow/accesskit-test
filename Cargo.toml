[workspace]
exclude = ["egui", "accesskit"]

[package]
name = "accesskit-test"
version = "0.1.0"
edition = "2024"

[dependencies]
accesskit = { version = "0.21.1" }
accesskit_winit = { version = "0.29.2" }
egui = { version = "0.33.0", features = ["accesskit"] }
egui-winit = { version = "0.33.0", features = ["accesskit"] }
egui_glow = { version = "0.33.0", features = ["winit", "x11"] }
glow = "0.16.0"
glutin = "0.32.3"
glutin-winit = "0.5.0"
log = "0.4.28"
winit = "0.30.12"

[patch.crates-io]
accesskit = { path = "./accesskit/common" }
accesskit_winit = { path = "./accesskit/platforms/winit" }
egui = { path = "./egui/crates/egui" }
egui-winit = { path = "./egui/crates/egui-winit" }
egui_glow = { path = "./egui/crates/egui_glow" }
